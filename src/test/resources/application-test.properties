# Test profile.
#
# The point of this file is that tests must never touch germanlearning.db, the
# database a developer is actually learning from. Everything below points the
# application at a throwaway file under target/ instead, which is recreated on
# every run and wiped by `mvn clean`.
spring.datasource.url=jdbc:sqlite:target/lingualearn-test.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=false
spring.jpa.properties.hibernate.id.db_structure_naming_strategy=single

# No test may depend on Tatoeba, Wiktionary or LanguageTool being reachable,
# so the three external integrations are off. Their own tests use a mocked
# RestClient and do not need the network either.
lingualearn.external.tatoeba.enabled=false
lingualearn.external.dictionary.enabled=false
lingualearn.external.language-tool.enabled=false

logging.level.org.springframework.security=WARN
logging.level.com.germanlearning=INFO

# SQLite cannot ALTER TABLE ADD CONSTRAINT, so Hibernate's create-drop export
# fails on the unique indexes for username and email and logs a stack trace it
# then ignores. Production is in the same position (ddl-auto=update never adds
# them either) and uniqueness is enforced by AuthService, so the noise is muted
# rather than worked around.
logging.level.org.hibernate.tool.schema.internal.ExceptionHandlerLoggedImpl=ERROR
