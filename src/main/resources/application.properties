# Application Configuration
spring.application.name=German Learning App
server.port=8081

# SQLite Database Configuration
spring.datasource.url=jdbc:sqlite:germanlearning.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate Configuration for SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- راه حل رفع خطای SQLite در Replit ---
# این خط باعث می‌شود Hibernate برای گرفتن IDهای جدید به درایور فشار نیاورد
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=false
# این خط به سازگاری بهتر با شناسه‌های اتوماتیک کمک می‌کند
spring.jpa.properties.hibernate.id.db_structure_naming_strategy=single
# ---------------------------------------

# External services (all called from the backend only; no keys required)
# Tatoeba enriches lessons with real example sentences.
lingualearn.external.tatoeba.enabled=true
lingualearn.external.tatoeba.base-url=https://tatoeba.org/en/api_v0
lingualearn.external.tatoeba.max-results=4
# German Wiktionary powers the Word Explorer through the standard MediaWiki API.
lingualearn.external.dictionary.enabled=true
lingualearn.external.dictionary.base-url=https://de.wiktionary.org/w/api.php
# LanguageTool powers the Writing Coach. The public endpoint is rate limited and
# intended for interactive use, which is why the check only ever runs when the
# learner presses the button. Point this at a self-hosted server for heavier use:
#   lingualearn.external.language-tool.base-url=http://localhost:8010/v2
lingualearn.external.language-tool.enabled=true
lingualearn.external.language-tool.base-url=https://api.languagetool.org/v2
lingualearn.external.language-tool.language=de-DE
lingualearn.external.language-tool.max-text-length=1500
lingualearn.external.user-agent=LinguaLearn/1.0 (portfolio project)

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.germanlearning=DEBUG