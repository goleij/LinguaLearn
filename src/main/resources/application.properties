# Application Configuration
spring.application.name=German Learning App
server.port=8081

# SQLite Database Configuration
spring.datasource.url=jdbc:sqlite:germanlearning.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate Configuration for SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- راه حل رفع خطای SQLite در Replit ---
# این خط باعث می‌شود Hibernate برای گرفتن IDهای جدید به درایور فشار نیاورد
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=false
# این خط به سازگاری بهتر با شناسه‌های اتوماتیک کمک می‌کند
spring.jpa.properties.hibernate.id.db_structure_naming_strategy=single
# ---------------------------------------

# Vaadin Configuration
vaadin.launch-browser=true
vaadin.whitelisted-packages=com.vaadin,org.vaadin,com.germanlearning

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.germanlearning=DEBUG