# End-to-end profile, used by the Playwright suite (frontend/playwright.config.ts).
#
# Runs the real application on its own port against its own database, so the
# browser tests can register users and earn XP without ever writing to
# germanlearning.db. Start it with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=e2e
server.port=8082

spring.datasource.url=jdbc:sqlite:target/lingualearn-e2e.db

# The seeded courses are the fixture the lesson test walks through, so the file
# is kept between runs; each test registers a fresh user instead.
spring.jpa.hibernate.ddl-auto=update

# Browser tests must not depend on third party services being up.
lingualearn.external.tatoeba.enabled=false
lingualearn.external.dictionary.enabled=false
lingualearn.external.language-tool.enabled=false

logging.level.com.germanlearning=INFO
