<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Learn German with short lessons that teach before they test. Every word you miss is saved and comes back until you know it."
    />

    <!--
      Outfit carries the headings and Inter the text. display=swap means the
      page renders in the fallback stack immediately rather than showing
      nothing while the fonts arrive, and the stack in tailwind.config.js keeps
      the layout sane if they never do.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    />

    <title>German Learning</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
